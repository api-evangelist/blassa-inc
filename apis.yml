aid: blassa-inc
name: Blassa Inc.
description: >-
  Blassa is an AI-powered location intelligence and geocoding platform built for
  the informal addressing systems common across the Middle East and Africa (MEA),
  where up to 40% of deliveries fail on the first attempt. The Blassa API turns
  ambiguous location descriptions and photos into precise coordinates and
  structured, verified addresses, offering forward and reverse geocoding,
  multi-language address autocomplete (Arabic, French, and local languages),
  address validation with deliverability scoring, and photo-to-location
  conversion. It targets logistics, e-commerce, and last-mile delivery companies
  looking to cut failed deliveries and improve checkout conversion. Founded in
  2021 and backed by 500 Global and the Sanabil Accelerator, Blassa exposes its
  capabilities through a credit-metered REST API with free, Pro, and Enterprise
  plans, an API-key auth model, webhook support, and a hosted developer portal.
